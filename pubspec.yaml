name: mamasalama_app
description: MamaSalama — maternal healthcare companion app (MVP frontend built from the Stitch design set).
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1
  cloud_firestore: ^5.4.4
  connectivity_plus: ^6.1.0
  flutter_local_notifications: ^18.0.1
  shared_preferences: ^2.3.3
  pdf: ^3.11.1
  printing: ^5.13.4
  fl_chart: ^0.69.0
  cloudinary_public: ^0.23.1
  dio: ^5.7.0
  image_picker: ^1.2.3
  file_picker: ^11.0.2
  emoji_picker_flutter: ^4.5.3
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  fake_cloud_firestore: ^3.1.0
  firebase_auth_mocks: ^0.14.1

flutter:
  uses-material-design: true
  generate: true
  # If you want the exact Stitch typefaces (Atkinson Hyperlegible Next + Inter),
  # add the google_fonts package and swap the TextStyle calls in lib/theme/app_theme.dart,
  # or drop .ttf files here and register them under a `fonts:` section.
