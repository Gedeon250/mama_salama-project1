name: mamasalama_app
description: MamaSalama — maternal healthcare companion app (MVP frontend built from the Stitch design set).
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  connectivity_plus: ^6.1.0
  flutter_local_notifications: ^18.0.1
  # Closing the design-doc gaps (see docs/superpowers/specs/2026-07-30-close-design-gaps-design.md):
  shared_preferences: ^2.3.2   # persist the chosen language (Gap 1: bilingual)
  audioplayers: ^6.1.0         # play audio health messages (Gap 2)
  geolocator: ^13.0.1          # real GPS attached to an SOS (Gap 3)
  url_launcher: ^6.3.1         # tap-to-call CHW/driver + open location in Maps (Gap 3/4)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    # Placeholder audio health messages (Gap 2). The content team replaces
    # these .mp3 files with real Kinyarwanda voice recordings; the filenames
    # and folder stay the same so no code changes are needed.
    - assets/audio/
  # If you want the exact Stitch typefaces (Atkinson Hyperlegible Next + Inter),
  # add the google_fonts package and swap the TextStyle calls in lib/theme/app_theme.dart,
  # or drop .ttf files here and register them under a `fonts:` section.
